# portainer/agent/docker-compose.yaml
#
# Portainer Agent — run this, unmodified, on any host that has its own
# standalone Docker containers you want visible/manageable from the existing
# Portainer server (installed inside k3s on Sadida — see PORTAINER.md at the
# repo root).
#
# Used on: Sadida itself (its standalone Docker containers, separate from
# the k3s node it also is) and Aery (Nextcloud + whatever else runs there
# via Docker). Ocra does NOT use this file — it already has its own
# Compose-managed stack, so its agent is one more service in
# monitoring/docker-compose.yaml instead, started/stopped together with
# everything else there.
#
# The agent only talks to the LOCAL Docker socket — it never calls out to
# Sadida's Portainer server on its own. The Portainer server connects TO the
# agent (pull, not push), so no outbound reachability is needed from this
# host, only inbound on port 9001.
#
# If a host ever switches to Podman instead of Docker (mentioned as a future
# experiment): this compose file needs the socket path changed to Podman's
# Docker-compatible API socket (rootful: /run/podman/podman.sock, after
# `systemctl enable --now podman.socket`) — the agent image itself is fine
# either way, it only expects a Docker-API-compatible socket.
#
# SECURITY: port 9001 is root-equivalent access to this host's Docker daemon
# (same risk tier as the Control API in monitoring/control-api/). Do not
# forward it through edge/'s public Caddy, and restrict it to Tailscale/LAN
# reachability only — ideally firewalled so only Sadida's address can reach
# it on each host.
#
#   cd portainer/agent
#   docker compose up -d
#
# Then in the Portainer UI (https://<sadida-ip>:30777): Environments > Add
# environment > Docker > Agent > point it at this host's Tailscale IP:9001.
# See PORTAINER.md, "Managing Docker containers on Sadida, Aery, and Ocra".

services:
  portainer-agent:
    image: portainer/agent:2.39.4   # pinned to match the Portainer server version — see PORTAINER.md
    container_name: homelab_portainer_agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      # Talks to the LOCAL Docker daemon only — this is what makes this
      # host's containers show up as a new environment in Portainer.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Read-only host filesystem view, used by Portainer for host-level
      # stats (disk, host info) in the UI.
      - /:/host:ro
