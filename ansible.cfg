; ansible.cfg
;
; Sets a default inventory path so every documented command in this repo
; (README.md, monitoring/README.md, docs/, and the comment headers in
; ansible/playbooks/*.yml) works as written — just `ansible-playbook
; ansible/playbooks/<name>.yml`, no `-i` flag needed — regardless of which
; user or shell environment runs it.
;
; Without this file, Ansible falls back to "implicit localhost" and silently
; matches zero real hosts, which looks like "no hosts matched" / "provided
; hosts list is empty" rather than a clear "you forgot -i" error.
;
; Must live at the REPO ROOT (not inside ansible/): Ansible looks for
; ./ansible.cfg relative to the current working directory, and every command
; in this repo's docs is run from the repo root.

[defaults]
inventory = ansible/inventory/hosts.yml
