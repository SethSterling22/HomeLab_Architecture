# Auto-provisioned datasources. Grafana reads this at startup, so the stack
# comes up already wired — no clicking through the UI after a rebuild.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: homelab-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # The Control API is exposed to the browser through Grafana's own
  # generic datasource proxy (GET/POST /api/datasources/proxy/uid/<uid>/<path>),
  # NOT through the Infinity plugin's own query engine. That matters: the
  # Business Forms panel's REST API update mode does a plain browser fetch()
  # to whatever URL it's given — it does not go through /api/ds/query, so
  # Infinity-specific auth settings (auth_method/bearerToken) never get
  # applied. Grafana's CORE proxy layer, on the other hand, attaches
  # provisioned custom HTTP headers (httpHeaderName/httpHeaderValue below) to
  # ANY "access: proxy" datasource regardless of plugin type — that's what
  # actually keeps the token server-side here.
  - name: Control API
    uid: homelab-control-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: ${CONTROL_API_URL}
    editable: false
    jsonData:
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Bearer ${CONTROL_API_TOKEN}"
