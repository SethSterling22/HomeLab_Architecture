# monitoring/docker-compose.yaml
#
# Monitoring and control stack. Runs on Ocra, which is always on, so the
# dashboard (and the "wake" button) stay available even when the k3s cluster
# or the on-demand nodes are down.
#
# Deliberately kept separate from the automation stack's compose file
# (Productivity_Tools/n8n/docker-compose.yaml). They have different owners and
# different failure domains: a restart here must never take n8n down.
#
#   docker compose up -d --build
#
# Note on networking: control-api uses host networking because Wake-on-LAN
# magic packets are UDP broadcasts to 192.168.68.255. A bridged container
# cannot broadcast onto the LAN segment, so WOL would silently fail.

name: homelab-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: homelab_prometheus
    restart: unless-stopped
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 1 year of retention: energy cost statistics are only interesting
      # when you can compare month over month.
      - "--storage.tsdb.retention.time=365d"
      - "--storage.tsdb.retention.size=20GB"
      - "--web.enable-lifecycle"      # allows POST /-/reload after editing rules
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    # Kept in step with current stable Grafana. Plugins installed via
    # GF_INSTALL_PLUGINS always fetch "latest", so an old pinned Grafana core
    # paired with a freshly-published plugin is a common source of
    # "Could not load plugin ... react/jsx-runtime" SystemJS errors, even when
    # the plugin's declared minimum version is technically satisfied.
    image: grafana/grafana:13.1.3
    container_name: homelab_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    # Grafana runs on the default Docker bridge network (not network_mode:
    # host), so it has no Tailscale interface and cannot resolve MagicDNS
    # names like ocra.stegosaurus-panga.ts.net — that hostname falls through
    # to public DNS from inside this container and resolves to garbage. Since
    # control-api is host-networked on this SAME machine, Grafana reaches it
    # through Docker's special host-gateway address instead. Requires Docker
    # Engine 20.10+ (long since standard on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      # volkovlabs-form-panel renders the wake/shutdown buttons (with
      # confirmation dialogs). yesoreyeram-infinity-datasource lets those
      # buttons call the Control API through Grafana's server-side proxy, so
      # the bearer token stays on the server and never reaches the browser.
      GF_INSTALL_PLUGINS: "volkovlabs-form-panel,yesoreyeram-infinity-datasource"
      # Grafana 11+ tries to auto-download several bundled "explore" app
      # plugins on startup (Logs/Traces/Profiles drilldown, Elasticsearch,
      # Zipkin). None of that applies here — we run neither Loki, Tempo,
      # Pyroscope, Elasticsearch nor Zipkin — and Ocra has no open internet
      # egress, so those downloads fail partway and leave a broken plugin
      # that 404s in the browser ("Could not load plugin ... module.js").
      # Disabling them by name (rather than GF_PLUGINS_PREINSTALL_DISABLED)
      # keeps GF_INSTALL_PLUGINS above working, since that migrates through
      # the same preinstall path in Grafana's config loader.
      GF_PLUGINS_DISABLE_PLUGINS: "grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,elasticsearch,zipkin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Deliberately NOT the shared CONTROL_API_URL from .env (that one is the
      # Tailscale hostname, correct for a human's browser/curl or for a
      # different machine — but this container has no Tailscale interface of
      # its own). Grafana's own outbound call to control-api always stays
      # local to this host, via the extra_hosts entry above.
      CONTROL_API_URL: "http://host.docker.internal:8090"
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN in .env}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  control-api:
    build:
      context: ./control-api
    image: homelab-control-api:local
    container_name: homelab_control_api
    restart: unless-stopped
    # Host networking is REQUIRED: WOL magic packets are LAN broadcasts.
    network_mode: host
    environment:
      CONTROL_API_PORT: "8090"
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN in .env}"
      CONTROL_API_SCRIPTS_DIR: "/opt/homelab/scripts/wol"
      # Blocked by default (see the warning in control-api/server.js). Only
      # set CONTROL_API_ALLOW_SHUTDOWN_AERY=true in .env AFTER verifying WOL
      # actually wakes Aery back up — see monitoring/README.md, section
      # "Idle auto-shutdown". A protected node with auto-shutdown enabled but
      # broken WOL is a self-inflicted outage.
      CONTROL_API_ALLOW_SHUTDOWN_AERY: "${CONTROL_API_ALLOW_SHUTDOWN_AERY:-false}"
      # Same idea, higher stakes: Sadida is the k3s control-plane, the
      # Ollama GPU host, AND the Proxmox hypervisor itself. Only set this to
      # true in .env after a REAL poweroff+WOL round trip is confirmed — see
      # monitoring/README.md, "Adding Sadida to wake/shutdown". This same
      # variable also gates scripts/wol/shutdown.sh's own master-protection
      # check directly (it reads this env var too), so both layers agree.
      CONTROL_API_ALLOW_SHUTDOWN_SADIDA: "${CONTROL_API_ALLOW_SHUTDOWN_SADIDA:-false}"
      KUBECONFIG: /home/control/.kube/config
    volumes:
      # The WOL scripts themselves, straight from this repository.
      - ../scripts/wol:/opt/homelab/scripts/wol:ro
      # SSH key used by shutdown.sh to reach the nodes. Use a DEDICATED key
      # whose authorized_keys entry is restricted to the shutdown command.
      - ${CONTROL_API_SSH_KEY:-./secrets/control_id_ed25519}:/home/control/.ssh/id_ed25519:ro
      - ${CONTROL_API_KNOWN_HOSTS:-./secrets/known_hosts}:/home/control/.ssh/known_hosts:ro
      # kubeconfig so shutdown.sh can drain nodes before powering them off.
      - ${CONTROL_API_KUBECONFIG:-./secrets/kubeconfig}:/home/control/.kube/config:ro

  idle-shutdown:
    # Watches network traffic (via Prometheus) on a configured set of nodes
    # and calls control-api's shutdown endpoint once a node has been idle
    # past its configured timeout. DRY RUN BY DEFAULT — see .env.example.
    #
    # Host networking so it can reach both Prometheus (published on
    # localhost:9090) and control-api (network_mode: host, only reachable
    # via the host's own address) as plain localhost calls — no Tailscale
    # hostname workaround needed, same reasoning as control-api itself.
    build:
      context: ./idle-shutdown
    image: homelab-idle-shutdown:local
    container_name: homelab_idle_shutdown
    restart: unless-stopped
    network_mode: host
    depends_on:
      prometheus:
        condition: service_started
      control-api:
        condition: service_started
    environment:
      PROMETHEUS_URL: "http://localhost:9090"
      CONTROL_API_URL: "http://localhost:8090"
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN in .env}"
      IDLE_SHUTDOWN_PORT: "8092"
      IDLE_CHECK_INTERVAL_SECONDS: "${IDLE_CHECK_INTERVAL_SECONDS:-300}"
      # SAFETY: stays "true" (log-only) until you deliberately flip it.
      IDLE_SHUTDOWN_DRY_RUN: "${IDLE_SHUTDOWN_DRY_RUN:-true}"
      IDLE_SHUTDOWN_NODES: "${IDLE_SHUTDOWN_NODES:-}"
      IDLE_TIMEOUT_MINUTES_DEFAULT: "${IDLE_TIMEOUT_MINUTES_DEFAULT:-60}"
      IDLE_TIMEOUT_MINUTES_AERY: "${IDLE_TIMEOUT_MINUTES_AERY:-}"
      IDLE_TIMEOUT_MINUTES_SRAM: "${IDLE_TIMEOUT_MINUTES_SRAM:-}"
      IDLE_TIMEOUT_MINUTES_XELOR: "${IDLE_TIMEOUT_MINUTES_XELOR:-}"
      IDLE_TRAFFIC_THRESHOLD_BPS: "${IDLE_TRAFFIC_THRESHOLD_BPS:-51200}"

  wake-proxy:
    # Reverse proxy for Aery's Nextcloud. Point clients at Ocra:8093 instead of
    # Aery directly; when Aery is asleep this serves a holding page and fires
    # a wake call instead of the request just failing to connect.
    #
    # Host networking so it can reach control-api (also network_mode: host)
    # as plain localhost:8090 — same reasoning as idle-shutdown above.
    build:
      context: ./wake-proxy
    image: homelab-wake-proxy:local
    container_name: homelab_wake_proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      control-api:
        condition: service_started
    environment:
      WAKE_PROXY_PORT: "8093"
      WAKE_PROXY_ADMIN_PORT: "8094"
      WAKE_PROXY_NODE: "aery"
      # Raw Tailscale IP, not the MagicDNS hostname: that hostname stopped
      # resolving correctly at some point (fell through to public DNS,
      # returning an unrelated anycast IP instead of failing loudly) — see
      # scripts/wol/wake.sh for the same issue hit via Wake-on-LAN.
      WAKE_PROXY_TARGET_HOST: "${WAKE_PROXY_TARGET_HOST:-100.98.226.8}"
      WAKE_PROXY_TARGET_PORT: "${WAKE_PROXY_TARGET_PORT:-8080}"
      CONTROL_API_URL: "http://localhost:8090"
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN in .env}"

  k3s-autowake:
    # Watches for Pending/Unschedulable pods and wakes one of the on-demand
    # k3s workers (Sram, Xelor, Sacro) when the cluster is actually short on
    # capacity — the pod-pressure equivalent of wake-proxy's HTTP-request
    # trigger, since there is no single HTTP entry point for "the cluster
    # needs a worker".
    #
    # Host networking for the same reason as wake-proxy: reaches control-api
    # via localhost:8090.
    build:
      context: ./k3s-autowake
    image: homelab-k3s-autowake:local
    container_name: homelab_k3s_autowake
    restart: unless-stopped
    network_mode: host
    depends_on:
      control-api:
        condition: service_started
    environment:
      K3S_AUTOWAKE_PORT: "8095"
      K3S_AUTOWAKE_NODES: "${K3S_AUTOWAKE_NODES:-sram,xelor,sacro}"
      K3S_AUTOWAKE_CHECK_INTERVAL_SECONDS: "${K3S_AUTOWAKE_CHECK_INTERVAL_SECONDS:-30}"
      K3S_AUTOWAKE_WAKE_COOLDOWN_MS: "${K3S_AUTOWAKE_WAKE_COOLDOWN_MS:-180000}"
      CONTROL_API_URL: "http://localhost:8090"
      CONTROL_API_TOKEN: "${CONTROL_API_TOKEN:?set CONTROL_API_TOKEN in .env}"
      KUBECONFIG: /home/autowake/.kube/config
    volumes:
      # Read-only: this service only ever runs `kubectl get`, never applies
      # or deletes anything.
      - ${CONTROL_API_KUBECONFIG:-./secrets/kubeconfig}:/home/autowake/.kube/config:ro

  shelly-exporter:
    # Bridges the Shelly plug's own RPC API into Prometheus text format. The
    # plug sits on the wall outlet feeding the shared power strip/UPS all the
    # compute nodes are plugged into, so this is REAL measured wattage for
    # the whole fleet at once — not per-node, but a ground truth to compare
    # against node:power_watts:total (modelled) and a way to detect outages
    # (see monitoring/prometheus/rules/shelly-power.yml).
    #
    # Custom-built exporter (./shelly-gen4-exporter), NOT the shellyctl image
    # this used to run: shellyctl has no support for Gen4 devices (its own
    # README describes itself as a Gen2 client, and it fails with "unable to
    # resolve device `app` to spec: unknown `app`" against this lab's Plug US
    # Gen4). No actively-maintained alternative with confirmed Gen4 support
    # was found either (checked 2026-08). Gen4 devices still speak the same
    # open Gen2+ RPC API though, so this polls Switch.GetStatus directly and
    # emits the SAME metric name shellyctl used
    # (shelly_status_instantaneous_active_power_watts) — zero changes needed
    # to shelly-power.yml or any dashboard panel. See
    # shelly-gen4-exporter/shelly-gen4-exporter.js for the full reasoning,
    # including why a real outage must still leave this container's own
    # /metrics scrape succeeding (no shelly_status_* lines, not a 5xx).
    #
    # No special networking needed here: unlike control-api, this only makes
    # outbound unicast calls to the plug's LAN IP, which works fine over the
    # default bridge network.
    build:
      context: ./shelly-gen4-exporter
    image: homelab-shelly-gen4-exporter:local
    container_name: homelab_shelly_exporter
    restart: unless-stopped
    environment:
      SHELLY_PSU_URL: "${SHELLY_PSU_URL:?set SHELLY_PSU_URL in .env, e.g. http://192.168.68.50}"
    ports:
      - "8091:8080"

  nut-exporter:
    # Bridges the CyberPower S175UC UPS's status into Prometheus text format,
    # via NUT (Network UPS Tools). The UPS itself is wired via USB into
    # Aery, NOT into Ocra — Aery is physically close to the UPS, Ocra is not
    # (see docs/nut-ups-monitoring.md). NUT's client-server model means this
    # container never touches USB: it makes an OUTBOUND network call to
    # Aery's own `upsd` on port 3493 (NUT's own protocol, unrelated to
    # HTTP/Prometheus), so — unlike control-api — it needs no special
    # networking and runs on the default bridge network, same as
    # shelly-exporter above.
    image: druggeri/nut_exporter:3.3.0
    container_name: homelab_nut_exporter
    restart: unless-stopped
    environment:
      NUT_EXPORTER_SERVER: "${NUT_UPS_HOST:?set NUT_UPS_HOST in .env — Aery's Tailscale IP}"
      NUT_EXPORTER_SERVERPORT: "3493"
      # battery.runtime and ups.realpower are requested in case the S175UC
      # reports them, but most consumer AVR units only reliably expose
      # charge/load/status — a variable the UPS doesn't support simply does
      # not appear as a metric, it does not error the scrape.
      NUT_EXPORTER_VARIABLES: "battery.charge,battery.runtime,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,ups.load,ups.realpower,ups.status"
    ports:
      - "9199:9199"
    # No healthcheck: same reasoning as shelly-exporter above — this is a
    # scratch-based image with no shell to exec a check with. Reachability
    # is verified externally via the `nut-ups` Prometheus job's own `up`
    # metric.

volumes:
  prometheus_data:
  grafana_data:
