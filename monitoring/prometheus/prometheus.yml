# monitoring/prometheus/prometheus.yml
#
# Scrape configuration for the HomeLab fleet.
#
# Targets are pinned to raw Tailscale IPs (100.x.x.x, from `tailscale status`),
# NOT MagicDNS hostnames. That was the original design (LAN-reconfiguration
# resilience without hardcoding IPs), but Ocra's own Tailscale health check
# reports "System DNS config not ideal — /etc/resolv.conf overwritten"
# (something on Ocra keeps resetting resolv.conf, fighting with Tailscale's
# resolver at 100.100.100.100 — see https://tailscale.com/s/dns-fight). Until
# that's fixed at the OS level, every *.stegosaurus-panga.ts.net hostname is
# unreliable from Ocra (and from any container without its own Tailscale
# interface), so every target below is a raw IP instead. If a node's Tailscale
# IP ever changes, update it here AND in scripts/wol/wake.sh + shutdown.sh —
# those already use raw IPs for the same reason. Every node runs node_exporter
# on :9100 (installed by ansible/playbooks/monitoring.yml).
#
# The `node` label is what every dashboard query and power-model rule joins on.
# Keep it stable and lowercase; it must match the node names used by the
# Control API and by scripts/wol/*.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    lab: homelab

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Prometheus itself ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          node: ocra

  # ── Fleet: node_exporter on every node ─────────────────────────
  # On-demand nodes (xelor, sacro) will show as down while asleep. That is
  # expected and is itself the data behind the uptime/availability panels,
  # so they are deliberately NOT excluded here.
  - job_name: nodes
    scrape_interval: 15s
    static_configs:
      - targets: ["100.123.206.35:9100"]
        labels:
          node: sadida
          tier: always_on
          role: hypervisor
      - targets: ["100.107.52.17:9100"]
        labels:
          node: ocra
          tier: always_on
          role: automation_brain
      # Raw Tailscale IP, unlike every other target in this job: Aery's
      # MagicDNS hostname stopped resolving correctly (fell through to
      # public DNS and returned an unrelated anycast address instead of
      # failing loudly) — see scripts/wol/wake.sh for the same issue hit
      # via Wake-on-LAN. Pinned here until MagicDNS for Aery is confirmed
      # fixed; swap back to the hostname at that point for consistency.
      - targets: ["100.98.226.8:9100"]
        labels:
          node: aery
          tier: always_on
          role: nextcloud_storage
      - targets: ["100.87.145.104:9100"]
        labels:
          node: sram
          tier: always_on
          role: k3s_worker
      - targets: ["100.92.255.18:9100"]
        labels:
          node: xelor
          tier: on_demand
          role: k3s_worker
      - targets: ["100.127.196.32:9100"]
        labels:
          node: sacro
          tier: on_demand
          role: k3s_worker
    relabel_configs:
      # Strip the port so `instance` reads as a clean hostname in panels.
      - source_labels: [__address__]
        regex: "([^:]+)(:[0-9]+)?"
        target_label: instance
        replacement: "${1}"

  # ── Fleet: per-process visibility (Phase 2) ────────────────────
  # process-exporter answers "what is running", which node_exporter cannot.
  # Same target set as the `nodes` job above, different port.
  - job_name: process-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["100.123.206.35:9256"]
        labels:
          node: sadida
      - targets: ["100.107.52.17:9256"]
        labels:
          node: ocra
      # Raw IP — see the comment on Aery's entry in the `nodes` job above.
      - targets: ["100.98.226.8:9256"]
        labels:
          node: aery
      - targets: ["100.87.145.104:9256"]
        labels:
          node: sram
      - targets: ["100.92.255.18:9256"]
        labels:
          node: xelor
      - targets: ["100.127.196.32:9256"]
        labels:
          node: sacro
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+)(:[0-9]+)?"
        target_label: instance
        replacement: "${1}"

  # ── Sadida: real GPU watts (Phase 2) ────────────────────────────
  # nvidia_gpu_exporter labels its own series by GPU `uuid`, not `node`.
  # The `node: sadida` label below is attached by Prometheus at scrape time
  # (static_configs labels apply to every series pulled from this target),
  # so no extra join/relabel is needed for power-model.yml to pick it up.
  - job_name: nvidia-gpu-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["100.123.206.35:9835"]
        labels:
          node: sadida
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+)(:[0-9]+)?"
        target_label: instance
        replacement: "${1}"

  # ── Idle auto-shutdown daemon's own metrics ──────────────────────
  # Runs with network_mode: host (same reason as control-api), so it is
  # reached the same way: Ocra's own Tailscale address, not a bridge
  # service name.
  - job_name: idle-shutdown
    static_configs:
      - targets: ["100.107.52.17:8092"]
        labels:
          node: ocra

  # ── Wake-on-demand daemons' own metrics ──────────────────────────
  # Both run with network_mode: host (same reason as control-api and
  # idle-shutdown), so both are reached via Ocra's own Tailscale address.
  - job_name: wake-proxy
    static_configs:
      - targets: ["100.107.52.17:8094"]
        labels:
          node: ocra

  - job_name: k3s-autowake
    static_configs:
      - targets: ["100.107.52.17:8095"]
        labels:
          node: ocra

  # ── Shelly power meter (Phase 3 — real measured wattage) ────────
  # shelly-exporter (shellyctl) polls the Gen2/Plus plug's RPC API and
  # re-exposes it here. It is on the same Docker bridge network as
  # Prometheus (no host networking needed, unlike control-api), so the
  # compose service name resolves directly.
  #
  # This measures the WHOLE fleet at once (the plug sits upstream of the
  # shared power strip/UPS), not a single node — see
  # monitoring/prometheus/rules/shelly-power.yml for how it feeds
  # lab:power_watts:measured and outage detection.
  - job_name: shelly-power
    static_configs:
      - targets: ["shelly-exporter:8080"]
        labels:
          # Deliberately NOT `node: ...` — this target measures the whole
          # fleet, not a single node, and every dashboard panel that filters
          # on $node expects that label to mean "one of the six compute
          # nodes". A different label name keeps it out of that filter.
          meter: shelly-psu

  # ── Control API (also exposes its own health) ──────────────────
  # control-api runs with network_mode: host (required for WOL broadcast),
  # so it is NOT on the same Docker bridge network as Prometheus — the
  # service name "control-api" has no DNS entry to resolve. Reach it via
  # Ocra's own Tailscale address instead, same as every other target here.
  - job_name: control-api
    static_configs:
      - targets: ["100.107.52.17:8090"]
        labels:
          node: ocra

  # ── Automation stack request counts (Productivity_Tools) ───────
  # Owned by the automation agent, not this repo. These targets stay
  # commented out until that side exposes /metrics:
  #   - Hermes gateway: add a Prometheus counter per POST /tool/:name
  #   - n8n: set N8N_METRICS=true
  # See docs/monitoring-stack-plan.md "Requests count — cross-repo coordination".
  #
  # - job_name: hermes
  #   static_configs:
  #     - targets: ["ocra.stegosaurus-panga.ts.net:8080"]
  #       labels:
  #         node: ocra
  #
  # - job_name: n8n
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["ocra.stegosaurus-panga.ts.net:5678"]
  #       labels:
  #         node: ocra
