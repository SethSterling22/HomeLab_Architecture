---
# ansible/playbooks/monitoring.yml
# Installs node_exporter as a systemd service on every monitored node.
#
# Usage:
#   ansible-playbook ansible/playbooks/monitoring.yml
#   ansible-playbook ansible/playbooks/monitoring.yml --limit sadida
#
# On-demand nodes (xelor, sacro) must be awake for this to reach them:
#   ./scripts/wol/wake.sh all
#
# node_exporter is intentionally installed from the upstream tarball rather
# than apt: Debian's packaged version lags well behind, and we want the
# hwmon/thermal collectors that feed the temperature and power panels.

- name: Install node_exporter on all monitored nodes
  hosts: monitored
  become: true

  vars:
    node_exporter_version: "1.8.2"
    node_exporter_user: "node_exporter"
    node_exporter_port: 9100
    node_exporter_arch: "linux-amd64"
    node_exporter_bin: "/usr/local/bin/node_exporter"
    # Bind to all interfaces: Prometheus reaches these nodes over Tailscale,
    # and the tailnet address is not always up when the unit starts.
    # Exposure is limited by the firewall rules below, not by the bind address.
    node_exporter_listen: "0.0.0.0:9100"
    # Collectors beyond the defaults. hwmon/thermal_zone provide temperature;
    # systemd provides per-unit state for the service health panels.
    node_exporter_collectors:
      - "--collector.systemd"
      - "--collector.processes"

  tasks:
    - name: Ensure required packages are present
      ansible.builtin.apt:
        name:
          - lm-sensors      # populates hwmon so temperature metrics appear
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Check installed node_exporter version
      ansible.builtin.command: "{{ node_exporter_bin }} --version"
      register: ne_installed
      changed_when: false
      failed_when: false

    - name: Download and install node_exporter
      when: node_exporter_version not in (ne_installed.stderr | default('') + ne_installed.stdout | default(''))
      block:
        - name: Download node_exporter tarball
          ansible.builtin.get_url:
            url: >-
              https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz
            dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            mode: "0644"

        - name: Unpack node_exporter
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Install node_exporter binary
          ansible.builtin.copy:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
            dest: "{{ node_exporter_bin }}"
            owner: root
            group: root
            mode: "0755"
            remote_src: true
          notify: Restart node_exporter

        - name: Clean up temporary files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
            - "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}"

    - name: Install node_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_bin }} --web.listen-address={{ node_exporter_listen }} {{ node_exporter_collectors | join(' ') }}
          Restart=always
          RestartSec=5
          # Hardening: this service only needs to read /proc and /sys.
          NoNewPrivileges=true
          ProtectHome=true
          ProtectSystem=strict
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Allow Prometheus to scrape node_exporter over the tailnet
      # Only applied when ufw is actually in use; skipped otherwise.
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
        from_ip: "{{ item }}"
      loop:
        - "100.0.0.0/8"        # Tailscale CGNAT range
        - "192.168.68.0/24"    # LAN
      failed_when: false
      changed_when: false

    - name: Verify node_exporter responds
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        return_content: false
        status_code: 200
      register: ne_health
      retries: 5
      delay: 3
      until: ne_health is succeeded

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true

# ── Phase 2: per-process visibility ──────────────────────────────────
# process-exporter answers "what is actually running" — node_exporter only
# gives system-wide totals. Installed on every monitored node, same tarball
# pattern as node_exporter above.
- name: Install process-exporter on all monitored nodes
  hosts: monitored
  become: true

  vars:
    process_exporter_version: "0.8.7"
    process_exporter_arch: "linux-amd64"
    process_exporter_bin: "/usr/local/bin/process-exporter"
    process_exporter_config_dir: "/etc/process-exporter"
    process_exporter_port: 9256
    process_exporter_listen: "0.0.0.0:9256"

  tasks:
    - name: Check installed process-exporter version
      ansible.builtin.command: "{{ process_exporter_bin }} --version"
      register: pe_installed
      changed_when: false
      failed_when: false

    - name: Download and install process-exporter
      when: process_exporter_version not in (pe_installed.stderr | default('') + pe_installed.stdout | default(''))
      block:
        - name: Download process-exporter tarball
          ansible.builtin.get_url:
            url: >-
              https://github.com/ncabatoff/process-exporter/releases/download/v{{ process_exporter_version }}/process-exporter-{{ process_exporter_version }}.{{ process_exporter_arch }}.tar.gz
            dest: "/tmp/process-exporter-{{ process_exporter_version }}.tar.gz"
            mode: "0644"

        - name: Unpack process-exporter
          ansible.builtin.unarchive:
            src: "/tmp/process-exporter-{{ process_exporter_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Install process-exporter binary
          ansible.builtin.copy:
            src: "/tmp/process-exporter-{{ process_exporter_version }}.{{ process_exporter_arch }}/process-exporter"
            dest: "{{ process_exporter_bin }}"
            owner: root
            group: root
            mode: "0755"
            remote_src: true
          notify: Restart process-exporter

        - name: Clean up temporary files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/process-exporter-{{ process_exporter_version }}.tar.gz"
            - "/tmp/process-exporter-{{ process_exporter_version }}.{{ process_exporter_arch }}"

    - name: Create process-exporter config directory
      ansible.builtin.file:
        path: "{{ process_exporter_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install process-exporter config (catch-all — one series per process name)
      ansible.builtin.copy:
        dest: "{{ process_exporter_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          process_names:
            - name: "{{ '{{' }}.Comm{{ '}}' }}"
              cmdline:
              - '.+'
      notify: Restart process-exporter

    - name: Install process-exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/process-exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Process Exporter
          Documentation=https://github.com/ncabatoff/process-exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          # Reading /proc/[pid]/smaps for OTHER users' processes requires root
          # (gather-smaps defaults to true, and this exporter is meant to see
          # every process on the box, not just its own user's). Hardened below
          # with the same filesystem protections as node_exporter otherwise.
          User=root
          Group=root
          Type=simple
          ExecStart={{ process_exporter_bin }} -config.path {{ process_exporter_config_dir }}/config.yml -web.listen-address={{ process_exporter_listen }}
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart process-exporter

    - name: Enable and start process-exporter
      ansible.builtin.systemd:
        name: process-exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Allow Prometheus to scrape process-exporter over the tailnet
      community.general.ufw:
        rule: allow
        port: "{{ process_exporter_port }}"
        proto: tcp
        from_ip: "{{ item }}"
      loop:
        - "100.0.0.0/8"
        - "192.168.68.0/24"
      failed_when: false
      changed_when: false

    - name: Verify process-exporter responds
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ process_exporter_port }}/metrics"
        return_content: false
        status_code: 200
      register: pe_health
      retries: 5
      delay: 3
      until: pe_health is succeeded

  handlers:
    - name: Restart process-exporter
      ansible.builtin.systemd:
        name: process-exporter
        state: restarted
        daemon_reload: true

# ── Phase 2: real GPU watts ───────────────────────────────────────────
# nvidia_gpu_exporter wraps `nvidia-smi` and is the only REAL (not modelled)
# power number anywhere in this stack. Sadida only — it is the sole node
# with the RTX 3050. See monitoring/prometheus/rules/power-model.yml for how
# this feeds node:power_watts:total.
- name: Install nvidia_gpu_exporter on Sadida
  hosts: sadida
  become: true

  vars:
    nvidia_gpu_exporter_version: "1.4.1"
    nvidia_gpu_exporter_arch: "linux_x86_64"
    nvidia_gpu_exporter_bin: "/usr/local/bin/nvidia_gpu_exporter"
    nvidia_gpu_exporter_port: 9835
    nvidia_gpu_exporter_listen: "0.0.0.0:9835"
    nvidia_gpu_exporter_user: "nvidia_gpu_exporter"

  tasks:
    - name: Confirm nvidia-smi is present (required by this exporter)
      ansible.builtin.command: nvidia-smi --query-gpu=name --format=csv,noheader
      register: nvsmi_check
      changed_when: false

    - name: Create nvidia_gpu_exporter system user with GPU device access
      ansible.builtin.user:
        name: "{{ nvidia_gpu_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        groups: "video,render"
        append: true
        state: present

    - name: Check installed nvidia_gpu_exporter version
      ansible.builtin.command: "{{ nvidia_gpu_exporter_bin }} --version"
      register: ge_installed
      changed_when: false
      failed_when: false

    - name: Download and install nvidia_gpu_exporter
      when: nvidia_gpu_exporter_version not in (ge_installed.stderr | default('') + ge_installed.stdout | default(''))
      block:
        - name: Download nvidia_gpu_exporter tarball
          ansible.builtin.get_url:
            url: >-
              https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v{{ nvidia_gpu_exporter_version }}/nvidia_gpu_exporter_{{ nvidia_gpu_exporter_version }}_{{ nvidia_gpu_exporter_arch }}.tar.gz
            dest: "/tmp/nvidia_gpu_exporter-{{ nvidia_gpu_exporter_version }}.tar.gz"
            mode: "0644"

        - name: Unpack nvidia_gpu_exporter
          # Unlike node_exporter/process-exporter, this tarball has NO
          # wrapping directory — it extracts nvidia_gpu_exporter and LICENSE
          # straight into dest. Extract into /tmp directly (already exists);
          # a per-version subdir here would need to be created first.
          ansible.builtin.unarchive:
            src: "/tmp/nvidia_gpu_exporter-{{ nvidia_gpu_exporter_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Install nvidia_gpu_exporter binary
          ansible.builtin.copy:
            src: "/tmp/nvidia_gpu_exporter"
            dest: "{{ nvidia_gpu_exporter_bin }}"
            owner: root
            group: root
            mode: "0755"
            remote_src: true
          notify: Restart nvidia_gpu_exporter

        - name: Clean up temporary files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/nvidia_gpu_exporter-{{ nvidia_gpu_exporter_version }}.tar.gz"
            - "/tmp/nvidia_gpu_exporter"
            - "/tmp/LICENSE"

    - name: Install nvidia_gpu_exporter systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nvidia_gpu_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=NVIDIA GPU Exporter
          Documentation=https://github.com/utkuozdemir/nvidia_gpu_exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ nvidia_gpu_exporter_user }}
          Group={{ nvidia_gpu_exporter_user }}
          Type=simple
          ExecStart={{ nvidia_gpu_exporter_bin }} --web.listen-address={{ nvidia_gpu_exporter_listen }}
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart nvidia_gpu_exporter

    - name: Enable and start nvidia_gpu_exporter
      ansible.builtin.systemd:
        name: nvidia_gpu_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Allow Prometheus to scrape nvidia_gpu_exporter over the tailnet
      community.general.ufw:
        rule: allow
        port: "{{ nvidia_gpu_exporter_port }}"
        proto: tcp
        from_ip: "{{ item }}"
      loop:
        - "100.0.0.0/8"
        - "192.168.68.0/24"
      failed_when: false
      changed_when: false

    - name: Verify nvidia_gpu_exporter responds
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nvidia_gpu_exporter_port }}/metrics"
        return_content: false
        status_code: 200
      register: ge_health
      retries: 5
      delay: 3
      until: ge_health is succeeded

  handlers:
    - name: Restart nvidia_gpu_exporter
      ansible.builtin.systemd:
        name: nvidia_gpu_exporter
        state: restarted
        daemon_reload: true
